; TenraTwin lab — PJSIP
; 100 = Tenra (pyVoIP), 101 = MicroSIP

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[100]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[100]
type=auth
auth_type=userpass
password=tenra100
username=100

[100]
type=aor
max_contacts=2
remove_existing=yes

[101]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=101
aors=101
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[101]
type=auth
auth_type=userpass
password=tenra101
username=101

[101]
type=aor
max_contacts=2
remove_existing=yes
